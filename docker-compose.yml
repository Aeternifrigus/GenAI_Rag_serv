# Brings up the two backing systems the service can use.
# Neither is required: without them the service falls back to in-memory storage
# and the file source only.

services:
  postgres:
    image: pgvector/pgvector:pg16   # postgres with the vector extension present
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
