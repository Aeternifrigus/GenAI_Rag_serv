name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Torch is installed separately so the job above proves the service works
      # without it, and the reranker tests below still run rather than skipping.
      - name: Install training extras
        run: pip install -r requirements-training.txt

      - name: Lint
        run: ruff check app tests scripts training

      - name: Unit tests
        run: pytest -v

      # Runs with no DATABASE_URL, no MONGO_URI and no ANTHROPIC_API_KEY, so this
      # also proves the offline fallbacks work rather than only being declared.
      - name: End-to-end smoke
        run: python scripts/smoke.py

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t genai-rag-service:${{ github.sha }} .
